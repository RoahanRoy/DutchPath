<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f9f9f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121413" />
    <title>Offline — DutchPath</title>
    <style>
      /* Standalone page: the app's stylesheet is not available here, so the
         brand tokens are inlined and the type falls back to the system stack. */
      :root {
        --background: #f9f9f7;
        --foreground: #1a1c1b;
        --muted: #434653;
        --card-bg: #ffffff;
        --border: rgba(0, 40, 100, 0.08);
        --primary: #002975;
        --on-primary: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #121413;
          --foreground: #e2e3e0;
          --muted: #c2c6d6;
          --card-bg: #1a1c1b;
          --border: rgba(66, 70, 84, 0.2);
          --primary: #4785ff;
          --on-primary: #00214d;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: var(--background);
        color: var(--foreground);
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main { width: 100%; max-width: 380px; text-align: center; }
      img { width: 72px; height: 72px; border-radius: 18px; margin-bottom: 24px; }
      h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 10px; }
      p { font-size: 15px; line-height: 1.6; color: var(--muted); margin-bottom: 28px; }
      button {
        width: 100%;
        min-height: 48px;
        padding: 14px 24px;
        border: none;
        border-radius: 9999px;
        background: var(--primary);
        color: var(--on-primary);
        font: inherit;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
      }
      button:active { transform: scale(0.97); }
      button:disabled { opacity: 0.6; cursor: default; }
      :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        DutchPath needs a connection to load your lessons and save your progress.
        Reconnect and try again — nothing you've completed is lost.
      </p>
      <button type="button" id="retry">Try again</button>
    </main>

    <script>
      const retry = document.getElementById("retry");

      retry.addEventListener("click", () => {
        retry.disabled = true;
        retry.textContent = "Reconnecting…";
        location.reload();
      });

      // Reload the moment connectivity returns, so the page never sits stale.
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
